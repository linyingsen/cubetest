<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">问AI123 Logo</title>
  <desc id="desc">A modern logo featuring the Chinese character 问 in a speech-bubble inspired rounded square and an AI badge.</desc>
  <defs>
    <linearGradient id="bg" x1="10" y1="12" x2="84" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0FBDA2"/>
      <stop offset="1" stop-color="#0E6EA2"/>
    </linearGradient>
    <linearGradient id="gloss" x1="18" y1="12" x2="72" y2="38" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.58"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="4" y="8" width="88" height="88" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#0A5686" flood-opacity="0.26"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="12" y="10" width="72" height="72" rx="20" fill="url(#bg)"/>
    <path d="M24 20C24 16.6863 26.6863 14 30 14H66C69.3137 14 72 16.6863 72 20V30H24V20Z" fill="url(#gloss)"/>
    <path d="M56 82L63 73.5H50.5L56 82Z" fill="#0F7BA2"/>
  </g>

  <text x="48" y="58" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="34" font-weight="800" fill="white">问</text>

  <rect x="55" y="56" width="31" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.96"/>
  <text x="70.5" y="70.2" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" fill="#0B6D93">AI</text>
</svg>
