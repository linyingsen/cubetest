<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>手机网页A</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f6f7fb;
      color: #222;
    }
    .card {
      max-width: 680px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
      padding: 16px;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 12px;
    }
    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      color: white;
      background: #276ef1;
    }
    button:disabled {
      opacity: .6;
    }
    .status {
      margin: 12px 0;
      font-size: 14px;
      color: #666;
    }
    pre {
      margin: 0;
      padding: 12px;
      border-radius: 8px;
      background: #111;
      color: #e6edf3;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 55vh;
      overflow: auto;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>手机网页A：抓取目标首页</h1>
    <button id="fetchBtn">抓取 m.91zheli.com 首页</button>
    <div id="status" class="status">点击按钮后将调用后端 API。</div>
    <pre id="result">（尚未请求）</pre>
  </div>

  <script>
    const fetchBtn = document.getElementById('fetchBtn');
    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');

    fetchBtn.addEventListener('click', async () => {
      fetchBtn.disabled = true;
      statusEl.textContent = '请求中...';
      resultEl.textContent = '加载中...';

      try {
        const response = await fetch('/api/fetch-home');
        const text = await response.text();

        if (!response.ok) {
          statusEl.textContent = `请求失败（${response.status}）`;
          resultEl.textContent = text;
          return;
        }

        statusEl.textContent = '请求成功，以下为抓取到的 HTML 字符串：';
        resultEl.textContent = text;
      } catch (err) {
        statusEl.textContent = '请求异常';
        resultEl.textContent = err instanceof Error ? err.message : String(err);
      } finally {
        fetchBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
